<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000010" />
    <meta name="description" content="Radiant Shadows — equipo de esports de Valorant. El fuego sigue." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rock+Salt&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Radiant Shadows · Esports de Valorant</title>
    <style>
      /* Entrada: el logo se acerca hasta la cara del dragón y por ahí aparece la página (estilo X).
         Va acá para que esté listo antes de pintar. */
      #splash {
        display: none;
      }
      #splash[data-play] {
        display: block;
        position: fixed;
        inset: 0;
        z-index: 100;
        pointer-events: none;
        animation: splash-end 0s linear 1.6s forwards;
      }
      #splash .cover {
        position: absolute;
        inset: 0;
        background: #000010;
        /* todo cubierto menos la silueta del logo: el logo es la "ventana" */
        -webkit-mask: url(/brand/logos/rs-positive.png) center / 160px auto no-repeat, linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask: url(/brand/logos/rs-positive.png) center / 160px auto no-repeat exclude, linear-gradient(#000 0 0);
        /* cabeza del dragón (61.2% / 24.7% del logo) */
        transform-origin: calc(50% + 17.9px) calc(50% - 39.8px);
        animation: splash-zoom 1.6s linear forwards;
      }
      #splash .logo {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 160px;
        height: auto;
        translate: -50% -50%;
        transform-origin: 61.2% 24.7%;
        filter: drop-shadow(0 0 28px rgba(142, 68, 255, 0.7));
        animation:
          splash-zoom 1.6s linear forwards,
          splash-logo 1.6s linear forwards;
      }
      @keyframes splash-zoom {
        0%,
        38% {
          transform: scale(1);
          animation-timing-function: ease-in-out;
        }
        52% {
          transform: scale(0.86);
          animation-timing-function: cubic-bezier(0.7, 0, 0.84, 0);
        }
        100% {
          transform: scale(220);
        }
      }
      @keyframes splash-logo {
        0%,
        58% {
          opacity: 1;
        }
        74%,
        100% {
          opacity: 0;
        }
      }
      @keyframes splash-end {
        to {
          visibility: hidden;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="cover"></div>
      <img class="logo" src="/brand/logos/rs-positive.png" alt="" />
    </div>
    <script>
      // una sola vez por visita, y nunca si la persona pidió menos movimiento
      try {
        var s = document.getElementById('splash')
        var calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches
        if (!calm && !sessionStorage.getItem('rs-splash')) {
          sessionStorage.setItem('rs-splash', '1')
          s.dataset.play = ''
          document.documentElement.classList.add('splashing')
        } else s.remove()
      } catch (e) {}
    </script>

    <div id="app"></div>
    <script type="module" src="/src/home/home.ts"></script>
  </body>
</html>
