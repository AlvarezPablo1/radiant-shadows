<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <script src="/no-zoom.js" defer></script>
    <meta name="theme-color" content="#000010" />
    <meta name="description" content="Radiant Shadows — equipo de esports de Valorant. El fuego sigue." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- tipografías sin frenar el primer dibujo de la página: se cargan en paralelo y se aplican al llegar -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Saira:wdth,wght@125,600;125,900&family=Rock+Salt&family=Sora:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Saira:wdth,wght@125,600;125,900&family=Rock+Salt&family=Sora:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Saira:wdth,wght@125,600;125,900&family=Rock+Salt&family=Sora:wght@400;500;600;700&display=swap" /></noscript>
    <!-- silueta del dragón de la transición entre secciones: lista antes del primer click -->
    <link rel="preload" href="/brand/mascots/dragon-transicion.webp" as="image" />
    <title>Radiant Shadows · Esports de Valorant</title>
    <style>
      /* Entrada: el logo crece desde el centro de la pantalla y, mientras crece, el fondo se desvanece
         y aparece la página detrás. Va acá para que esté listo antes de pintar. */
      #splash {
        display: none;
      }
      #splash[data-play] {
        display: block;
        position: fixed;
        inset: 0;
        z-index: 100;
        pointer-events: none;
        animation: splash-end 0s linear 1.6s forwards;
      }
      #splash .cover {
        position: absolute;
        inset: 0;
        background: #000010;
        animation: splash-cover 1.6s linear forwards;
      }
      #splash .logo {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 160px;
        height: auto;
        translate: -50% -50%;
        /* crece desde su centro: queda centrado en la pantalla en todas las resoluciones */
        transform-origin: 50% 50%;
        filter: drop-shadow(0 0 28px rgba(142, 68, 255, 0.7));
        will-change: transform, opacity;
        animation:
          splash-zoom 1.6s linear forwards,
          splash-logo 1.6s linear forwards;
      }
      /* quieto, un pequeño amague hacia atrás y después crece hasta salirse de la pantalla */
      @keyframes splash-zoom {
        0%,
        38% {
          transform: scale(1);
          animation-timing-function: ease-in-out;
        }
        50% {
          transform: scale(0.86);
          animation-timing-function: cubic-bezier(0.55, 0, 0.85, 0.35);
        }
        100% {
          transform: scale(40);
        }
      }
      @keyframes splash-logo {
        0%,
        62% {
          opacity: 1;
        }
        92%,
        100% {
          opacity: 0;
        }
      }
      /* el fondo oscuro se va mientras el logo crece: la home aparece detrás */
      @keyframes splash-cover {
        0%,
        54% {
          opacity: 1;
        }
        84%,
        100% {
          opacity: 0;
        }
      }
      @keyframes splash-end {
        to {
          visibility: hidden;
        }
      }
      /* Llegada desde otra sección: la página arranca tapada por la cortina del dragón y se destapa */
      html.arriving::after {
        content: '';
        position: fixed;
        inset: 0;
        z-index: 90;
        background: #0d0524;
        pointer-events: none;
        transition: opacity 0.5s ease;
      }
      html.arriving.arrived::after {
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="cover"></div>
      <img class="logo" src="/brand/logos/rs-splash.webp" alt="" fetchpriority="high" />
    </div>
    <script>
      // una sola vez por visita, y nunca si la persona pidió menos movimiento
      try {
        var s = document.getElementById('splash')
        var calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches
        // venimos de otra sección con la transición del dragón: arrancar tapados
        if (sessionStorage.getItem('rs-nav')) {
          sessionStorage.removeItem('rs-nav')
          document.documentElement.classList.add('arriving')
        }
        if (!calm && !sessionStorage.getItem('rs-splash')) {
          sessionStorage.setItem('rs-splash', '1')
          s.dataset.play = ''
          document.documentElement.classList.add('splashing')
        } else s.remove()
      } catch (e) {}
    </script>

    <div id="app"></div>
    <script type="module" src="/src/home/main.tsx"></script>
  </body>
</html>
